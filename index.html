<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Grille de compétences</title>

<style>
body { font-family: Arial, sans-serif; margin: 20px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #000; padding: 6px; text-align: center; vertical-align: middle; }
th { background: #f2f2f2; }
.comp { font-weight: bold; background: #e6e6e6; }
.cap { text-align: left; }
.result { font-weight: bold; margin-top: 15px; }
button { margin-top: 15px; padding: 10px; }
</style>

</head>

<body>

<h2>Grille d’évaluation des compétences</h2>

<table>
<thead>
<tr>
<th>Compétences</th>
<th>Capacités</th>
<th>Questions</th>
<th>0</th>
<th>1</th>
<th>2</th>
<th>Validation</th>
<th>Aide chiffrée</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<button onclick="calculer()">Calculer les notes</button>

<h3 id="final"></h3>

<script>

const data = [
{
comp: "S’approprier",
items: [
["Rechercher, extraire et organiser l’information.", "1A"],
["Traduire des informations, des codages.", "1B"]
]
},
{
comp: "Analyser / Raisonner",
items: [
["Émettre des conjectures, formuler des hypothèses.", "4A"],
["Proposer, choisir une méthode de résolution ou un protocole.", "7A"],
["Élaborer un algorithme.", "4B"],
["", "7B"]
]
},
{
comp: "Réaliser",
items: [
["Mettre en œuvre un protocole en respectant les règles de sécurité.", "2A"],
["Utiliser un modèle, représenter, calculer.", "3A"],
["Expérimenter, faire une simulation.", "6A"],
["", "3B"],
["", "5B"]
]
},
{
comp: "Valider",
items: [
["Exploiter et interpréter des résultats.", "5A"],
["Contrôler la vraisemblance d’une mesure.", "2B"],
["Valider une hypothèse, conclure.", "6B"]
]
},
{
comp: "Communiquer",
items: [
["Rendre compte d’un résultat à l’oral ou à l’écrit.", "8A"],
["Expliquer une démarche.", "8B"]
]
}
];

const body = document.getElementById("tableBody");

data.forEach((bloc, ci) => {

let first = true;

bloc.items.forEach((it, i) => {

let tr = document.createElement("tr");

if (first) {
tr.innerHTML += `<td class="comp" rowspan="${bloc.items.length}">${bloc.comp}</td>`;
first = false;
}

tr.innerHTML += `
<td class="cap">${it[0]}</td>
<td>${it[1]}</td>

<td><input type="radio" name="c-${ci}-${i}" value="0"></td>
<td><input type="radio" name="c-${ci}-${i}" value="1"></td>
<td><input type="radio" name="c-${ci}-${i}" value="2" checked></td>

<td><input type="checkbox" id="v-${ci}-${i}" checked></td>
<td id="calc-${ci}-${i}">-</td>
`;

body.appendChild(tr);

});

// ligne résultat compétence
let trRes = document.createElement("tr");
trRes.innerHTML = `
<td colspan="7" style="text-align:right;font-weight:bold;">
Note ${bloc.comp}
</td>
<td id="res-${ci}">- / 4</td>
`;

body.appendChild(trRes);

});

function calculer() {

let total = 0;

data.forEach((bloc, ci) => {

let somme = 0;
let valid = 0;

bloc.items.forEach((it, i) => {

let radios = document.getElementsByName(`c-${ci}-${i}`);
let val = 0;

radios.forEach(r => {
if (r.checked) val = parseInt(r.value);
});

let ok = document.getElementById(`v-${ci}-${i}`).checked;

if (ok) {
somme += val;
valid++;
document.getElementById(`calc-${ci}-${i}`).innerText = val;
} else {
document.getElementById(`calc-${ci}-${i}`).innerText = "X";
}

});

let note = 0;

if (valid > 0) {
note = (somme / (valid * 2)) * 4;
}

total += note;

document.getElementById(`res-${ci}`).innerText =
note.toFixed(2) + " / 4";

});

let final = (total / 20) * 10;

document.getElementById("final").innerText =
"Note finale : " + final.toFixed(2) + " / 10";

}

</script>

</body>
</html>
