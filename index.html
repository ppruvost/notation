<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grille d’évaluation des compétences</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background: #fff;
}

h2 {
    margin-bottom: 16px;
    font-size: 1.4rem;
}

/* conteneur responsive table */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table {
    display: table;
    width: 100%;
    max-width: 100%;
    table-layout: auto;
    border-collapse: collapse;
    width: 100%;
    min-width: 900px;
}

th, td {
    border: 1px solid #000;
    padding: 6px;
    text-align: center;
    vertical-align: middle;
    font-size: 0.9rem;
}

th {
    background: #f2f2f2;
}

.comp {
    background: #e6e6e6;
    font-weight: bold;
    width: 180px;
}

.cap {
    text-align: left;
    width: 420px;
}

select {
    width: 70px;
    max-width: 100%;
}

input[type="radio"], input[type="checkbox"] {
    transform: scale(1.1);
}

button {
    margin-top: 16px;
    padding: 12px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
    max-width: 320px;
}

.result-line {
    font-weight: bold;
    background: #fafafa;
}

#final {
    margin-top: 16px;
    font-size: 18px;
    font-weight: bold;
    line-height: 1.6;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {

    h2 {
        font-size: 1.2rem;
    }

    table {
        min-width: 700px;
    }

    th, td {
        font-size: 0.8rem;
        padding: 4px;
    }

    .cap {
        width: auto;
        min-width: 200px;
    }

    select {
        width: 60px;
    }
}

@media (max-width: 480px) {

    .table-wrapper {
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow-x: auto;
        background: #fff;
    }

    th, td {
        white-space: nowrap;
    }

    #final {
        font-size: 16px;
    }

    select {
        font-size: 14px;
    }

    input[type="radio"], input[type="checkbox"] {
        transform: scale(1.2);
    }

    body {
        padding: 10px;
    }

    h2 {
        font-size: 1.1rem;
    }

    button {
        width: 100%;
    }

    table {
        min-width: 650px;
    }
}
</style>
</head>

<body>

<h2>Grille d’évaluation des compétences</h2>

<div class="table-wrapper">
<table>
    <thead>
        <tr>
            <th>Compétences</th>
            <th>Capacités</th>
            <th>Questions</th>
            <th>0</th>
            <th>1</th>
            <th>2</th>
            <th>Validation</th>
            <th>Total compétence</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>
</div>

<button onclick="calculer()">Calculer les notes</button>

<h3 id="final"></h3>

<script>

const questionOptions = [
    "",
    "1A","2A","3A","4A","5A","6A","7A","8A",
    "1B","2B","3B","4B","5B","6B","7B","8B"
];

const data = [
{
    comp: "S’approprier",
    items: [
        "Rechercher, extraire et organiser l’information.",
        "Traduire des informations, des codages.",
        "",
        "",
        ""
    ]
},
{
    comp: "Analyser / Raisonner",
    items: [
        "Émettre des conjectures, formuler des hypothèses.",
        "Proposer, choisir une méthode de résolution.",
        "Élaborer un algorithme.",
        "",
        ""
    ]
},
{
    comp: "Réaliser",
    items: [
        "Mettre en œuvre une méthode ou un protocole.",
        "Utiliser un modèle, représenter, calculer.",
        "Expérimenter, faire une simulation.",
        "",
        ""
    ]
},
{
    comp: "Valider",
    items: [
        "Exploiter et interpréter des résultats.",
        "Contrôler la vraisemblance d’une mesure.",
        "Valider un modèle ou une hypothèse.",
        "",
        ""
    ]
},
{
    comp: "Communiquer",
    items: [
        "Rendre compte d’un résultat.",
        "Expliquer une démarche.",
        "",
        "",
        ""
    ]
}
];

const body = document.getElementById("tableBody");

data.forEach((bloc, ci) => {

    let first = true;

    bloc.items.forEach((capacite, i) => {

        let tr = document.createElement("tr");

        if (first) {
            tr.innerHTML += `
                <td class="comp" rowspan="5">${bloc.comp}</td>
            `;
            first = false;
        }

        tr.innerHTML += `
            <td class="cap">${capacite}</td>
            <td>
                <select id="q-${ci}-${i}" onchange="updateQuestionLists()">
                    ${questionOptions.map(q => `<option value="${q}">${q}</option>`).join("")}
                </select>
            </td>
            <td><input type="radio" name="note-${ci}-${i}" value="0"></td>
            <td><input type="radio" name="note-${ci}-${i}" value="1"></td>
            <td><input type="radio" name="note-${ci}-${i}" value="2" checked></td>
            <td><input type="checkbox" id="val-${ci}-${i}" checked></td>
            ${i === 0 ? `<td id="res-${ci}" rowspan="5">- / 4</td>` : ``}
        `;

        body.appendChild(tr);
    });

    
});

function updateQuestionLists() {

    let selectedValues = [];

    data.forEach((bloc, ci) => {
        bloc.items.forEach((_, i) => {
            const select = document.getElementById(`q-${ci}-${i}`);
            if (select.value !== "") selectedValues.push(select.value);
        });
    });

    data.forEach((bloc, ci) => {
        bloc.items.forEach((_, i) => {
            const select = document.getElementById(`q-${ci}-${i}`);
            const currentValue = select.value;

            Array.from(select.options).forEach(option => {
                if (option.value === "") return;

                option.disabled = (
                    option.value !== currentValue &&
                    selectedValues.includes(option.value)
                );
            });
        });
    });
}

function calculer() {

    let totalSur20 = 0;
    let totalCasesCochees = 0;

    data.forEach((bloc, ci) => {

        let somme = 0;
        let nbValides = 0;

        bloc.items.forEach((_, i) => {

            let radios = document.getElementsByName(`note-${ci}-${i}`);
            let valeur = 0;

            radios.forEach(r => {
                if (r.checked) valeur = parseInt(r.value);
            });

            const valide = document.getElementById(`val-${ci}-${i}`).checked;

            if (valide) {
                somme += valeur;
                nbValides++;
                totalCasesCochees++;
                
            } else {
                
            }
        });

        let noteSur4 = 0;

        if (nbValides > 0) {
            noteSur4 = Math.round((somme / (nbValides * 2)) * 4);
        }

        if (noteSur4 < 0) noteSur4 = 0;
        if (noteSur4 > 4) noteSur4 = 4;

        if (nbValides > 0) {
            nbCompetencesEvaluees++;

            /*
            minimum 1/4 par compétence évaluée
            (= plancher global futur de 4/20 mini)
            */
            if (noteSur4 < 1) noteSur4 = 1;
        }

        totalSur20 += noteSur4;

        document.getElementById(`res-${ci}`).innerText = noteSur4 + " / 4";
    });

    let total20 = 0;
    let nbCompetencesEvaluees = 0;

    if (totalCasesCochees > 0) {        

        let maxPossible = nbCompetencesEvaluees * 4;

        total20 = Math.round((totalSur20 / maxPossible) * 20);
    }

    // plancher demandé
    if (total20 > 0 && total20 < 4) total20 = 4;
    if (total20 > 20) total20 = 20;

    document.getElementById("final").innerHTML =
        "Total sur 20 : <strong>" + total20 + " / 20</strong>";
}

updateQuestionLists();

</script>

</body>
</html>
